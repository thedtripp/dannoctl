name: Nightly E2E Report Test (bruce-bot, inlined)

# Inlined copy of bruce-bot's e2e_nightly.yml (2026-07-25) -- runs on
# dannoctl's free public-repo Actions minutes instead of bruce-bot's billed
# private minutes. bruce-bot's own copy keeps only workflow_dispatch as a
# manual fallback; this is now the real schedule. Safe to move the same way
# daily_report.yml was: this workflow deliberately never commits anything
# back (no contents:write permission, no git push step), so there's no
# concurrency/state-race risk like daily_report.yml has.
#
# Job logs here are public -- see daily_report.yml's note in this repo about
# keeping step names/comments generic. This workflow does create a real
# GitHub issue in bruce-bot (via PRIVATE_REPO_TOKEN) to verify structure --
# that issue itself stays private, only this run's logs are public.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Checkout bruce-bot
        uses: actions/checkout@v7
        with:
          repository: thedtripp/bruce-bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout archie base
        # actions/checkout's init+fetch+checkout sequence echoes the target
        # commit's subject line ("HEAD is now at ...") into this public log
        # for any detached-HEAD (tag/SHA) ref -- no input suppresses it. A
        # quiet manual clone + sparse-checkout avoids that while keeping the
        # same base_resume-only working tree.
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch v0.2.1 --no-checkout \
            https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/thedtripp/archie.git \
            archie-repo
          cd archie-repo
          git sparse-checkout init --cone
          git sparse-checkout set base_resume
          git -c advice.detachedHead=false checkout --quiet v0.2.1
          sparse-checkout-cone-mode: false

      - name: Configure chester PAT
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Cache chester embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-model-sentence-transformers-all-MiniLM-L6-v2

      - name: Install chester
        run: pip install "chester[semantic] @ git+https://github.com/thedtripp/chester.git@7d71bf2"

      - name: Run nightly E2E test
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ARCHIE_BASE_DIR: ${{ github.workspace }}/repo/archie-repo/base_resume
        run: scripts/dispatch.sh e2e
