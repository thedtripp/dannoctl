name: Run archie for Checked dannoctls (bruce-bot, inlined)

# Inlined copy of bruce-bot's tailor_checked_jobs.yml (2026-07-25) -- runs on
# dannoctl's free public-repo Actions minutes instead of bruce-bot's billed
# private minutes. bruce-bot's own copy is now a thin dispatcher on
# issues:closed -- GitHub can't deliver that event to another repo directly,
# so it does its own title gate itself and just relays the issue number.
#
# Shares the bruce-bot-state-writer concurrency group with daily_report.yml
# and mark_considered.yml, now that all three run in this repo again.
#
# Requires PRIVATE_REPO_TOKEN to have Contents:Read-and-write AND
# Packages:Read-only on thedtripp/archie (the latter to pull the
# ghcr.io/thedtripp/archie-ci container image below) -- a broader grant than
# daily_report.yml/e2e_nightly.yml needed, since this is the one workflow
# that actually pushes archie's output back to its repo.
#
# ANTHROPIC_API_KEY/LANGFUSE_* are separate secrets from PRIVATE_REPO_TOKEN
# (not GitHub PATs) -- copy the same values bruce-bot already has.
#
# Job logs here are public -- the archie run itself only prints progress,
# not any per-entry detail, per daily_report.yml's existing note. Keep step
# names/comments here generic.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "bruce-bot issue number that was closed"
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: bruce-bot-state-writer
  cancel-in-progress: false

jobs:
  archie:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedtripp/archie-ci:v0.2.1
      credentials:
        username: thedtripp
        password: ${{ secrets.PRIVATE_REPO_TOKEN }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Trust all checkouts (container runs as a different uid than the runner)
        run: git config --global --add safe.directory '*'

      - name: Checkout bruce-bot
        uses: actions/checkout@v4
        with:
          repository: thedtripp/bruce-bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: repo

      - name: Fetch issue body
        id: issue
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh issue view "${{ inputs.issue_number }}" --repo thedtripp/bruce-bot --json body -q .body > /tmp/issue_body.txt

      - name: Count checked dannoctls
        id: count
        working-directory: repo
        run: |
          count=$(python3 -m common.parse_checked_jobs < /tmp/issue_body.txt | wc -l)
          echo "Found $count checked entry/entries."
          if [ "$count" -gt 0 ]; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout archie
        if: steps.count.outputs.has_jobs == 'true'
        uses: actions/checkout@v4
        with:
          repository: thedtripp/archie
          ref: v0.2.1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: repo/archie-repo
          fetch-depth: 0

      - name: Allow pip to fetch the private chester dependency
        if: steps.count.outputs.has_jobs == 'true'
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install archie
        if: steps.count.outputs.has_jobs == 'true'
        run: pip install -e "./repo/archie-repo[observability]"

      - name: Run archie on checked dannoctls
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ARCHIE_PAT: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: https://us.cloud.langfuse.com
        run: ISSUE_BODY="$(cat /tmp/issue_body.txt)" python3 -u repo/tailor_checked_jobs.py

      - name: Commit dannoctl state to bruce-bot
        if: always()
        working-directory: repo
        run: >-
          scripts/git_commit_and_push.sh
          "Mark checked dannoctls as considered (issue #${{ inputs.issue_number }})"
          job_state.json job_descriptions/ analytics/runs.jsonl all_keywords.txt

      - name: Commit results to archie
        if: always() && steps.count.outputs.has_jobs == 'true'
        working-directory: repo/archie-repo
        run: >-
          ../scripts/git_commit_and_push.sh
          "Run archie for dannoctls checked in bruce-bot issue #${{ inputs.issue_number }}"
          output/ analytics/

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 repo/scripts/report_workflow_failure.py "tailor_checked_jobs.yml"

      - name: Resolve failure tracker on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 repo/scripts/resolve_workflow_failure.py "tailor_checked_jobs.yml"
